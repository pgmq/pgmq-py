name: Vendor PGMQ SQL

# Opens a tracking issue when src/pgmq/sql/VERSION is behind a
# pgmq/pgmq semver release. Maintainers open the pin pull request.
# The pgmq org does not allow GITHUB_TOKEN to create pull requests.
#
# Triggers:
# 1. repository_dispatch from pgmq/pgmq (optional upstream hook)
# 2. Daily cron polling the extension repo's latest release
# 3. workflow_dispatch for manual runs
#
# See docs/development.md for setup and verification.

on:
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [pgmq-extension-release]
  workflow_dispatch:
    inputs:
      tag:
        description: PGMQ extension release tag (e.g. v1.11.1)
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  vendor-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Resolve extension release
        id: meta
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          ARGS=(--github-output --trigger "${{ github.event_name }}")
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${DISPATCH_TAG:-$DISPATCH_VERSION}"
            if [ -z "$TAG" ]; then
              echo "repository_dispatch requires client_payload.tag or .version"
              exit 1
            fi
            ARGS+=(--tag "$TAG")
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS+=(--tag "${{ inputs.tag }}")
          fi
          uv run --python 3.13 --no-project python \
            scripts/pgmq_extension_release_status.py "${ARGS[@]}"

      - name: Pin already current
        if: steps.meta.outputs.needs_update != 'true'
        run: |
          echo "SQL pin is already at ${{ steps.meta.outputs.version }}; nothing to do."

      - name: Open tracking issue
        if: steps.meta.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          TRIGGER: ${{ steps.meta.outputs.trigger }}
        run: |
          set -euo pipefail
          TITLE="chore: pin pgmq.sql to PGMQ extension ${TAG}"
          PINNED="$(tr -d '[:space:]' < src/pgmq/sql/VERSION)"
          EXISTING="$(
            gh issue list --state open --limit 100 --json number,title \
              --jq "[.[] | select(.title == \"${TITLE}\") | .number][0] // empty"
          )"
          if [ -n "${EXISTING}" ]; then
            echo "Issue #${EXISTING} already tracks this pin."
            echo "Issue already open: https://github.com/${GITHUB_REPOSITORY}/issues/${EXISTING}" \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          BODY_FILE="${RUNNER_TEMP}/pgmq-pin-issue.md"
          {
            echo "Automated pin notice from \`${TRIGGER}\` for PGMQ extension \`${TAG}\`."
            echo
            echo "The \`pgmq\` org does not allow GitHub Actions to create pull requests. Open the pin pull request by hand."
            echo
            echo "- Source: https://github.com/pgmq/pgmq/releases/tag/${TAG}"
            echo "- Current pin: \`${PINNED}\`"
            echo "- Target pin: \`${VERSION}\` (\`${TAG}\`)"
            echo "- Pin file: \`src/pgmq/sql/VERSION\`"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/vendor/pgmq-sql-${VERSION}" \
              >/dev/null 2>&1; then
              echo "- Branch already exists: https://github.com/${GITHUB_REPOSITORY}/compare/main...vendor/pgmq-sql-${VERSION}?expand=1"
            fi
            echo
            echo "Update the pin:"
            echo
            echo '```bash'
            echo "uv run python scripts/vendor_pgmq_sql.py ${TAG} --update-pin --force"
            echo "make test-sql-install-env"
            echo '```'
            echo
            echo "Merge after review, then cut a \`pgmq-py\` release so PyPI users receive the new SQL."
          } > "${BODY_FILE}"

          URL="$(
            gh issue create \
              --title "${TITLE}" \
              --label dependencies \
              --body-file "${BODY_FILE}"
          )"
          echo "Opened ${URL}"
          echo "Opened tracking issue: ${URL}" >> "${GITHUB_STEP_SUMMARY}"
