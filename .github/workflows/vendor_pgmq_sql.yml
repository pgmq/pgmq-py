name: Vendor PGMQ SQL

# Keeps src/pgmq/sql/VERSION pinned to a pgmq/pgmq semver release.
# CI and package builds download pgmq.sql from that tag; the SQL file is
# not committed.
#
# Triggers (either can open the pin PR if the other missed or failed):
# 1. repository_dispatch from pgmq/pgmq (optional upstream hook)
# 2. Daily cron polling the extension repo's latest release
# 3. workflow_dispatch for manual runs
#
# See docs/development.md for setup and verification.

on:
  schedule:
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [pgmq-extension-release]
  workflow_dispatch:
    inputs:
      tag:
        description: PGMQ extension release tag (e.g. v1.11.1)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  vendor-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Resolve extension release
        id: meta
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          ARGS=(--github-output --trigger "${{ github.event_name }}")
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${DISPATCH_TAG:-$DISPATCH_VERSION}"
            if [ -z "$TAG" ]; then
              echo "repository_dispatch requires client_payload.tag or .version"
              exit 1
            fi
            ARGS+=(--tag "$TAG")
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS+=(--tag "${{ inputs.tag }}")
          fi
          uv run python scripts/pgmq_extension_release_status.py "${ARGS[@]}"

      - name: Pin already current
        if: steps.meta.outputs.needs_update != 'true'
        run: |
          echo "SQL pin is already at ${{ steps.meta.outputs.version }}; nothing to do."

      - name: Update version pin and download pgmq.sql
        if: steps.meta.outputs.needs_update == 'true'
        run: |
          uv run python scripts/vendor_pgmq_sql.py "${{ steps.meta.outputs.tag }}" \
            --update-pin --force

      - name: Install project
        if: steps.meta.outputs.needs_update == 'true'
        run: uv sync --all-groups --all-extras

      - name: Verify pinned SQL
        if: steps.meta.outputs.needs_update == 'true'
        run: |
          uv run python - <<'PY'
          from pgmq.install import get_embedded_install_sql, get_embedded_sql_version
          expected = "${{ steps.meta.outputs.version }}"
          actual = get_embedded_sql_version()
          if actual != expected:
              raise SystemExit(f"Expected pinned version {expected}, got {actual}")
          sql = get_embedded_install_sql()
          if "CREATE SCHEMA IF NOT EXISTS pgmq" not in sql:
              raise SystemExit("Downloaded SQL is missing CREATE SCHEMA IF NOT EXISTS pgmq")
          print(f"Pinned SQL version OK: {actual}")
          PY

      - name: Run SQL install unit tests
        if: steps.meta.outputs.needs_update == 'true'
        run: uv run python -m unittest tests.test_install.TestEmbeddedInstallSql tests.test_vendor_pgmq_sql -v

      - name: Create pull request
        if: steps.meta.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: vendor/pgmq-sql-${{ steps.meta.outputs.version }}
          delete-branch: true
          title: "chore: pin pgmq.sql to PGMQ extension ${{ steps.meta.outputs.tag }}"
          body: |
            Automated pin update triggered by `${{ steps.meta.outputs.trigger }}` for PGMQ extension release `${{ steps.meta.outputs.tag }}`.

            - Source: [pgmq/pgmq](https://github.com/pgmq/pgmq) @ `${{ steps.meta.outputs.tag }}`
            - Pin file: `src/pgmq/sql/VERSION`
            - `src/pgmq/sql/pgmq.sql` is downloaded in CI and at package build time; it is not committed.

            Merge after review, then cut a `pgmq-py` release so PyPI users receive the new SQL.
          commit-message: "chore: pin pgmq.sql to PGMQ extension ${{ steps.meta.outputs.tag }}"
          labels: dependencies,sql
